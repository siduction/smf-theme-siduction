name: Release theme

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"   # v1.0 -> 1.0

      - name: Build theme zip
        id: build
        run: |
          chmod +x build.sh
          echo "zip=$(./build.sh "${{ steps.ver.outputs.version }}" | tail -n1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease";; esac   # v1.0-rc1 -> prerelease
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.build.outputs.zip }}" \
            --title "Siduction $VERSION" \
            --generate-notes $PRERELEASE
