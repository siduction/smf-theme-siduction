name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: PHP syntax check (php -l)
        run: |
          command -v php >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq php-cli; }
          fail=0
          while IFS= read -r -d '' f; do
            php -l "$f" || fail=1
          done < <(find . -name '*.php' -not -path './dist/*' -print0)
          exit $fail

      - name: Validate theme_info.xml
        run: |
          command -v xmllint >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils; }
          xmllint --noout theme_info.xml

      - name: ShellCheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          shellcheck build.sh deploy.sh

      - name: Packaging smoke test
        run: |
          chmod +x build.sh
          ZIP="$(./build.sh 9.9.9-citest | tail -n1)"
          echo "Built: $ZIP"

          # 1) Wrapper directory and theme_info.xml present
          unzip -l "$ZIP" | grep -q 'siduction/theme_info.xml' \
            || { echo "FAIL: siduction/theme_info.xml missing from zip"; exit 1; }

          # 2) Version stamped into theme_info.xml and @version
          unzip -p "$ZIP" siduction/theme_info.xml | grep -q '<version>9.9.9-citest</version>' \
            || { echo "FAIL: version not stamped into theme_info.xml"; exit 1; }
          unzip -p "$ZIP" siduction/index.template.php | grep -q '@version 9.9.9-citest' \
            || { echo "FAIL: @version not stamped into index.template.php"; exit 1; }

          # 3) No VCS, CI or ops files in the zip
          if unzip -l "$ZIP" | grep -qE 'deploy\.sh|build\.sh|\.github|\.git/'; then
            echo "FAIL: unexpected files in zip:"; unzip -l "$ZIP"; exit 1
          fi
          # No hidden top-level directories (tooling/editor) in the zip
          if unzip -l "$ZIP" | grep -qE ' siduction/\.[^/]+/'; then
            echo "FAIL: hidden directory in zip:"; unzip -l "$ZIP"; exit 1
          fi

          echo "OK: packaging checks passed"
